name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate shell and workflow sources
        run: |
          set -euo pipefail
          shellcheck scripts/install_pinned_npm.sh scripts/validate_release_request.sh
          mkdir -m 0700 /tmp/actionlint
          curl --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 120 \
            --retry 3 --retry-all-errors \
            -fsSLo /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' |
            sha256sum --check -
          tar --no-same-owner -xzf /tmp/actionlint.tar.gz \
            -C /tmp/actionlint actionlint
          test "$(/tmp/actionlint/actionlint -version | head -n 1)" = "1.7.12"
          /tmp/actionlint/actionlint \
            .github/workflows/ci.yml \
            .github/workflows/release.yml

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Use the supported npm toolchain
        run: bash scripts/install_pinned_npm.sh

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

      - name: Full dependency audit
        run: npm audit --audit-level=high

      - name: Pack dry run
        run: npm pack --dry-run

  docker:
    name: Docker build and health smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pinned Docker Engine and CLI
        uses: docker/setup-docker-action@6d7cfa65f60a9dda7b46e5513fa982536f3c9877 # v5.3.0
        with:
          version: v29.1.3

      - name: Build image
        run: |
          set -euo pipefail
          sentinel='credential-sentinel-must-never-enter-image'
          printf '%s\n' "$sentinel" > gha-creds-ci-sentinel.json
          trap 'rm -f gha-creds-ci-sentinel.json' EXIT
          docker build -t videovector-mcp-server:ci .
          container_id="$(docker create videovector-mcp-server:ci)"
          trap 'rm -f gha-creds-ci-sentinel.json; docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker export "$container_id" -o /tmp/videovector-mcp-filesystem.tar
          forbidden_paths="$(tar -tf /tmp/videovector-mcp-filesystem.tar |
            grep -Ei '(^|/)(gha-creds[^/]*\.json|.*service[-_]?account[^/]*\.json|\.env(\.[^/]*)?|\.npmrc|.*\.(pem|p12|pfx|key))$' || true)"
          unexpected_paths="$(printf '%s\n' "$forbidden_paths" |
            grep -Ev '^usr/local/lib/node_modules/npm/\.npmrc$' || true)"
          if [[ -n "$unexpected_paths" ]]; then
            printf '%s\n' "$unexpected_paths" >&2
            echo "Credential-pattern filename entered the image." >&2
            exit 1
          fi
          docker run --rm videovector-mcp-server:ci \
            sh -c 'test ! -s /usr/local/lib/node_modules/npm/.npmrc'
          if grep -aF "$sentinel" /tmp/videovector-mcp-filesystem.tar; then
            echo "Credential sentinel entered the image." >&2
            exit 1
          fi

      - name: Smoke registry stdio default
        run: |
          set -euo pipefail
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"registry-smoke","version":"1.0.0"}}}'
          api_key="sk_live_$(printf '0%.0s' {1..48})"
          response="$(printf '%s\n' "$request" |
            timeout 20s docker run --rm -i \
              -e VIDEOVECTOR_API_KEY="$api_key" \
              videovector-mcp-server:ci)"
          RESPONSE="$response" node <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE);
          if (
            payload.jsonrpc !== '2.0'
            || payload.id !== 1
            || payload.result?.serverInfo?.name !== 'videovector'
          ) {
            throw new Error('OCI image did not start with the declared stdio transport');
          }
          NODE

      - name: Start HTTP server
        run: |
          docker run --rm -d \
            --name videovector-mcp-server-ci \
            -p 8080:8080 \
            -e MCP_TRANSPORT_MODE=http \
            -e VIDEOVECTOR_BASE_URL=https://api.vectormethods.com/api/v2 \
            videovector-mcp-server:ci

      - name: Smoke health endpoint
        run: |
          for _attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs videovector-mcp-server-ci
          exit 1

      - name: Stop HTTP server
        if: always()
        run: docker stop videovector-mcp-server-ci || true

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          cache: npm

      - name: Use the supported npm toolchain
        run: bash scripts/install_pinned_npm.sh

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Full dependency audit
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Scan history and filesystem with checksum-pinned Gitleaks
        run: |
          set -euo pipefail
          mkdir -m 0700 /tmp/gitleaks
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors -fsSLo /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz' | sha256sum --check -
          tar --no-same-owner -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
          test -f /tmp/gitleaks/gitleaks
          test ! -L /tmp/gitleaks/gitleaks
          echo 'e18325d568268b6efb6cd0cc721f8bea5667f4cd1c8d03618ab61987f41269ad  /tmp/gitleaks/gitleaks' | sha256sum --check -
          test "$(/tmp/gitleaks/gitleaks version)" = "8.24.3"
          /tmp/gitleaks/gitleaks git --no-banner --redact --log-opts=--all .
          /tmp/gitleaks/gitleaks dir --no-banner --redact .
