name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Bot-created annotated release tag, for example videovector-mcp-v2.1.1"
        required: true
        type: string
      release_body_sha256:
        description: "SHA-256 of the scanned release body held by vectormethods-public-bot"
        required: true
        type: string
      expected_target_sha:
        description: "Exact commit SHA peeled from the immutable bot-created release tag"
        required: true
        type: string
      expected_tag_object_sha:
        description: "Exact annotated Git tag object SHA created by vectormethods-public-bot"
        required: true
        type: string
      operation_nonce:
        description: "Deterministic SHA-256 identity for this exact release operation"
        required: true
        type: string
      draft_release_id:
        description: "Exact bot-owned draft GitHub Release id to stage before publication"
        required: true
        type: string
      bundle_source_release_id:
        description: "Optional exact GitHub Release id holding a reusable release-bundle.zip"
        required: false
        default: ""
        type: string
      bundle_source_asset_id:
        description: "Optional exact release-bundle.zip asset id; required with bundle_source_release_id"
        required: false
        default: ""
        type: string
      bundle_source_sha256:
        description: "Optional exact release-bundle.zip SHA-256; required with bundle_source_release_id"
        required: false
        default: ""
        type: string

run-name: Release ${{ inputs.release_tag }} [${{ inputs.operation_nonce }}]

permissions:
  contents: read

# Serialize npm dist-tags and the MCP Registry listing across all release tags.
concurrency:
  group: release-videovector-mcp-server
  cancel-in-progress: false

env:
  MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
  MCP_PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz
  NPM_PACKAGE: "@vectormethods/videovector-mcp-server"

jobs:
  guard:
    name: Validate bot release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      resume: ${{ steps.validate.outputs.resume }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      tag_object_sha: ${{ steps.validate.outputs.tag_object_sha }}
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Install checksum-pinned npm toolchain
        run: bash scripts/install_pinned_npm.sh

      - name: Install locked verifier dependencies
        run: npm ci --ignore-scripts

      - name: Validate actor, annotated tag object, and peeled commit
        id: validate
        env:
          BUNDLE_SOURCE_ASSET_ID: ${{ inputs.bundle_source_asset_id }}
          BUNDLE_SOURCE_RELEASE_ID: ${{ inputs.bundle_source_release_id }}
          BUNDLE_SOURCE_SHA256: ${{ inputs.bundle_source_sha256 }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
          EXPECTED_TAG_OBJECT_SHA: ${{ inputs.expected_tag_object_sha }}
          EXPECTED_TARGET_SHA: ${{ inputs.expected_target_sha }}
          OPERATION_NONCE: ${{ inputs.operation_nonce }}
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TAG_PREFIX: videovector-mcp-v
        run: |
          set -euo pipefail
          bash scripts/validate_release_request.sh

      - name: Validate release metadata
        env:
          RELEASE_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-artifacts.mjs validate-project \
            --version "$RELEASE_VERSION"

  build:
    name: Build immutable reproducible release bundle
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Recovery reads the private draft asset, which requires repository push access.
    permissions:
      contents: write

    steps:
      - name: Checkout guarded source commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.13"

      - name: Install checksum-pinned npm toolchain
        run: bash scripts/install_pinned_npm.sh

      - name: Install locked verifier dependencies
        run: npm ci --ignore-scripts

      - name: Run complete source verification
        run: |
          set -euo pipefail
          npm run verify
          npm audit --audit-level=high

      - name: Build the publication bundle twice
        if: ${{ needs.guard.outputs.resume != 'true' }}
        env:
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.guard.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          common_args=(
            --tag "$RELEASE_TAG"
            --tag-object-sha "$TAG_OBJECT_SHA"
            --tag-commit-sha "$SOURCE_SHA"
            --source-sha "$SOURCE_SHA"
            --version "$RELEASE_VERSION"
            --release-body-sha256 "$RELEASE_BODY_SHA256"
          )
          node scripts/release-artifacts.mjs build \
            --output release-bundle "${common_args[@]}"
          node scripts/release-artifacts.mjs build \
            --output "$RUNNER_TEMP/release-bundle-rebuild" "${common_args[@]}"
          node scripts/release-artifacts.mjs compare-bundles \
            --left release-bundle \
            --right "$RUNNER_TEMP/release-bundle-rebuild"
          node scripts/release-artifacts.mjs verify-bundle \
            --bundle release-bundle \
            --tag "$RELEASE_TAG" \
            --tag-object-sha "$TAG_OBJECT_SHA" \
            --tag-commit-sha "$SOURCE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256"

      - name: Recover and independently verify the reusable bundle
        if: ${{ needs.guard.outputs.resume == 'true' }}
        env:
          BUNDLE_SOURCE_ASSET_ID: ${{ inputs.bundle_source_asset_id }}
          BUNDLE_SOURCE_RELEASE_ID: ${{ inputs.bundle_source_release_id }}
          BUNDLE_SOURCE_SHA256: ${{ inputs.bundle_source_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.guard.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          python scripts/release_draft_staging.py prepare \
            --kind mcp \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --expected-target-sha "$SOURCE_SHA" \
            --expected-tag-object-sha "$TAG_OBJECT_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256" \
            --bundle-source-release-id "$BUNDLE_SOURCE_RELEASE_ID" \
            --bundle-source-asset-id "$BUNDLE_SOURCE_ASSET_ID" \
            --bundle-source-sha256 "$BUNDLE_SOURCE_SHA256" \
            --bundle release-bundle \
            --archive release-transport/release-bundle.zip

      - name: Smoke the exact npm tarball with bounded stdio
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(
            find release-bundle/npm -maxdepth 1 -type f -name '*.tgz' -print
          )
          test "${#tarballs[@]}" = "1"
          smoke_dir="$RUNNER_TEMP/npm-artifact-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          npm init -y >/dev/null
          timeout 120s npm install --ignore-scripts "${GITHUB_WORKSPACE}/${tarballs[0]}"
          test -x node_modules/.bin/videovector-mcp
          test -f node_modules/@vectormethods/videovector-mcp-server/dist/index.js
          if timeout 10s env -u VIDEOVECTOR_API_KEY \
            node_modules/.bin/videovector-mcp \
            >/tmp/npm-no-key.stdout 2>/tmp/npm-no-key.stderr; then
            echo "Stdio package started without its required API key." >&2
            exit 1
          fi
          grep -Fq 'VIDEOVECTOR_API_KEY environment variable is required' \
            /tmp/npm-no-key.stderr
          api_key="sk_live_$(printf '0%.0s' {1..48})"
          response="$(
            {
              printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"npm-release-smoke","version":"1.0.0"}}}'
              printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
              printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            } |
              timeout 20s env VIDEOVECTOR_API_KEY="$api_key" \
                node_modules/.bin/videovector-mcp
          )"
          RESPONSE="$response" node \
            "$GITHUB_WORKSPACE/scripts/validate-stdio-smoke.mjs" \
            "$GITHUB_WORKSPACE/artifacts/tool-contract.json"

      - name: Archive and independently verify the fresh bundle
        if: ${{ needs.guard.outputs.resume != 'true' }}
        env:
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.guard.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          python scripts/release_draft_staging.py prepare \
            --kind mcp \
            --release-tag "$RELEASE_TAG" \
            --expected-target-sha "$SOURCE_SHA" \
            --expected-tag-object-sha "$TAG_OBJECT_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256" \
            --bundle release-bundle \
            --archive release-transport/release-bundle.zip

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-release-bundle
          path: release-transport/
          if-no-files-found: error
          retention-days: 90

  stage-draft:
    name: Stage exact bundle on the bot-owned draft
    needs:
      - guard
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout guarded release verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.13"

      - name: Install checksum-pinned npm toolchain
        run: bash scripts/install_pinned_npm.sh

      - name: Install locked verifier dependencies
        run: npm ci --ignore-scripts

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcp-release-bundle
          path: release-transport

      - name: Reverify and reconcile exact draft assets
        env:
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.guard.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          python scripts/release_draft_staging.py stage \
            --kind mcp \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --expected-target-sha "$SOURCE_SHA" \
            --expected-tag-object-sha "$TAG_OBJECT_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256" \
            --draft-release-id "$DRAFT_RELEASE_ID" \
            --archive release-transport/release-bundle.zip \
            --bundle "$RUNNER_TEMP/not-used"

      - name: Attest the exact staged release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release-transport/release-bundle.zip
            release-transport/release-manifest.json
            release-transport/registry-metadata.json

  publish-npm:
    name: Reconcile exact npm publication
    needs:
      - guard
      - build
      - stage-draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout guarded release verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.13"

      - name: Install checksum-pinned npm toolchain
        run: bash scripts/install_pinned_npm.sh

      - name: Install locked verifier dependencies
        run: npm ci --ignore-scripts

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcp-release-bundle
          path: release-transport

      - name: Materialize and verify the exact staged bundle
        env:
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.guard.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          python scripts/release_draft_staging.py materialize \
            --kind mcp \
            --release-tag "$RELEASE_TAG" \
            --expected-target-sha "$SOURCE_SHA" \
            --expected-tag-object-sha "$TAG_OBJECT_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256" \
            --archive release-transport/release-bundle.zip \
            --bundle release-bundle

      - name: Verify request-bound bundle before publisher installation
        env:
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.guard.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          node scripts/release-artifacts.mjs verify-bundle \
            --bundle release-bundle \
            --tag "$RELEASE_TAG" \
            --tag-object-sha "$TAG_OBJECT_SHA" \
            --tag-commit-sha "$SOURCE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256"

      - name: Install checksum-pinned OIDC dist-tag publisher
        run: bash scripts/install_pinned_npm.sh publisher

      - name: Verify the pinned npm provenance contract offline
        run: |
          set -euo pipefail
          node scripts/validate-npm-provenance.mjs --npm-root "$(npm root -g)/npm"

      - name: Reconcile npm version and monotonic dist-tags
        env:
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.guard.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          node scripts/release-publication.mjs publish-npm \
            --bundle release-bundle \
            --tag "$RELEASE_TAG" \
            --tag-object-sha "$TAG_OBJECT_SHA" \
            --tag-commit-sha "$SOURCE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256"

      - name: Smoke the exact public npm version
        env:
          RELEASE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "Public npm smoke attempt ${attempt}/12"
            smoke_dir="$RUNNER_TEMP/npm-public-smoke"
            rm -rf "$smoke_dir"
            mkdir -p "$smoke_dir"
            cd "$smoke_dir"
            npm init -y >/dev/null
            if timeout 60s npm install --ignore-scripts \
              "${NPM_PACKAGE}@${RELEASE_VERSION}"; then
              test -x node_modules/.bin/videovector-mcp
              test -f node_modules/@vectormethods/videovector-mcp-server/dist/index.js
              exit 0
            fi
            sleep 10
          done
          exit 1

  publish-mcp-registry:
    name: Reconcile exact active MCP Registry version
    needs:
      - guard
      - build
      - stage-draft
      - publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout guarded release verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.13"

      - name: Install checksum-pinned npm toolchain
        run: bash scripts/install_pinned_npm.sh

      - name: Install locked verifier dependencies
        run: npm ci --ignore-scripts

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcp-release-bundle
          path: release-transport

      - name: Materialize and verify the exact staged bundle
        env:
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.guard.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          python scripts/release_draft_staging.py materialize \
            --kind mcp \
            --release-tag "$RELEASE_TAG" \
            --expected-target-sha "$SOURCE_SHA" \
            --expected-tag-object-sha "$TAG_OBJECT_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256" \
            --archive release-transport/release-bundle.zip \
            --bundle release-bundle

      - name: Verify request-bound bundle before publisher installation
        env:
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.guard.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          node scripts/release-artifacts.mjs verify-bundle \
            --bundle release-bundle \
            --tag "$RELEASE_TAG" \
            --tag-object-sha "$TAG_OBJECT_SHA" \
            --tag-commit-sha "$SOURCE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256"

      - name: Install checksum-pinned MCP publisher
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 120 \
            --retry 3 --retry-all-errors \
            -fsSLo /tmp/mcp-publisher.tar.gz "$MCP_PUBLISHER_URL"
          echo "$MCP_PUBLISHER_SHA256  /tmp/mcp-publisher.tar.gz" |
            sha256sum --check -
          mkdir -m 0700 /tmp/mcp-publisher-bin
          tar -xOf /tmp/mcp-publisher.tar.gz mcp-publisher \
            > /tmp/mcp-publisher-bin/mcp-publisher
          chmod 0755 /tmp/mcp-publisher-bin/mcp-publisher
          /tmp/mcp-publisher-bin/mcp-publisher --version

      - name: Reconcile exact active MCP Registry metadata
        env:
          RELEASE_BODY_SHA256: ${{ inputs.release_body_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          TAG_OBJECT_SHA: ${{ needs.guard.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          node scripts/release-publication.mjs publish-mcp \
            --bundle release-bundle \
            --tag "$RELEASE_TAG" \
            --tag-object-sha "$TAG_OBJECT_SHA" \
            --tag-commit-sha "$SOURCE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --release-body-sha256 "$RELEASE_BODY_SHA256" \
            --publisher /tmp/mcp-publisher-bin/mcp-publisher
