<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VideoVector Studio</title>
<style>/* WIDGET_STYLES */</style></head><body>
<header class="studio-header"><h1>VideoVector Studio</h1><button class="studio-search-back-link" id="open-app">Open in app ↗</button></header>
<div id="status" role="status">Loading results…</div>
<section id="analysis-progress" aria-live="polite" hidden>
  <strong id="analysis-stage"></strong><p id="analysis-message"></p>
  <p id="analysis-counts" class="muted"></p><p id="analysis-files" class="muted"></p><p id="analysis-newer" class="muted" hidden></p><p id="analysis-updated" class="muted"></p>
  <button id="analysis-reconnect" class="secondary" type="button" hidden>Reconnect live updates</button>
</section>
<form id="upload-form" hidden>
  <label for="files">Choose the files for this analysis</label>
  <input id="files" type="file" multiple required>
  <p id="selection" class="muted"></p>
  <button id="submit" class="secondary" type="submit">Upload and continue</button>
  <p id="upload-message" role="status"></p>
</form>
<div class="studio-layout" id="result-workspace">
  <aside id="studio-video-rail"></aside>
  <main id="studio-main">
    <div id="studio-search" class="studio-search-surface" hidden></div>
    <div id="player-area" class="studio-search-surface">
      <button class="studio-search-back-link" id="back-results" hidden>← Back to results</button>
      <div id="search-carousel" hidden></div>
      <h2 id="selected-title" hidden></h2>
      <div class="studio-player-content">
        <div class="studio-playback">
          <img id="image-preview" alt="Selected image" hidden>
          <video id="player" aria-label="Selected result" controls preload="metadata" hidden></video>
          <div id="timeline" hidden></div>
          <div class="actions" id="downloads" hidden></div>
          <div id="toolbar" hidden></div>
          <div id="rows"></div><div id="empty" hidden>No results on this page.</div>
          <button class="secondary" id="next" hidden>Load more</button>
        </div>
        <div class="studio-analysis">
          <section id="analysis" aria-label="Analysis" hidden></section>
          <section id="video-analysis" aria-label="Video analysis" hidden></section>
        </div>
      </div>
    </div>
  </main>
</div>
<script type="module">/* RESULTS_SCRIPT */</script></body></html>
